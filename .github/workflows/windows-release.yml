name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows x64 binaries
        shell: cmd
        run: build_windows.bat

      - name: Smoke test release files
        shell: pwsh
        run: |
          $files = @(
            'release/TaiwanSubtitle-windows-x64-v0.6.2-portable.zip',
            'release/TaiwanSubtitle-windows-x64-setup.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 1024) { throw "Release file is unexpectedly small: $file ($size bytes)" }
            Write-Host ("$file => {0:N0} bytes ({1:N1} MiB)" -f $size, ($size / 1MB))
          }
          $portable = (Get-Item 'release/TaiwanSubtitle-windows-x64-v0.6.2-portable.zip').Length
          if ($portable -ge 2147483648) { throw "Portable ZIP is too large for GitHub Release: $portable bytes" }

      - name: Upload portable + installer
        uses: actions/upload-artifact@v5
        with:
          name: TaiwanSubtitle-windows-x64-v0.6.2
          if-no-files-found: error
          path: |
            release/TaiwanSubtitle-windows-x64-v0.6.2-portable.zip
            release/TaiwanSubtitle-windows-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/TaiwanSubtitle-windows-x64-v0.6.2-portable.zip
            release/TaiwanSubtitle-windows-x64-setup.exe
